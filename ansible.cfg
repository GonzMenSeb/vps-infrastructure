[defaults]
inventory = inventory.yml
roles_path = roles
# Local convenience only. Jenkins writes its own .vault_pass_tmp and passes it with
# --vault-password-file (or ANSIBLE_VAULT_PASSWORD_FILE in the lint stage); both override
# this, so CI does not need `.vault_pass` to exist and exits 0 without it. It does print
# a cosmetic `.vault_pass was not found` line in every stage — verified harmless, and the
# reason this is not worth "fixing" by also writing .vault_pass in the Jenkinsfile.
# Relative to the cwd, i.e. run ansible from the repo root.
vault_password_file = .vault_pass
host_key_checking = False
retry_files_enabled = False
forks = 10
fact_caching = jsonfile
fact_caching_connection = .ansible_facts_cache
fact_caching_timeout = 3600
gathering = smart

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey

[privilege_escalation]
become = True
become_method = sudo
