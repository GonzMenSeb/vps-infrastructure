---
- name: Configure w1 host agent
  hosts: w1
  become: true
  vars_files:
    - vault.yml

  roles:
    - host_agent

- name: Configure w1 agent host
  hosts: w1
  become: true
  vars_files:
    - vault.yml

  roles:
    - { role: agent_host, tags: [agent_host] }

  post_tasks:
    - name: Write Ansible deploy marker (textfile collector)
      ansible.builtin.copy:
        dest: /var/lib/node_exporter/textfile/ansible_deploy.prom
        owner: node_exporter
        group: node_exporter
        mode: "0644"
        content: |
          # HELP vps_last_deploy_timestamp_seconds Unix timestamp of the last successful Ansible deploy.
          # TYPE vps_last_deploy_timestamp_seconds gauge
          vps_last_deploy_timestamp_seconds{playbook="w1-playbook.yml",host="{{ inventory_hostname }}"} {{ ansible_date_time.epoch }}
