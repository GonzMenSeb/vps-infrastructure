---
- name: Post-deploy health checks (w1)
  hosts: w1
  become: true
  vars_files:
    - ../vault.yml

  tasks:
    - name: Verify SSH is reachable
      wait_for:
        port: 22
        host: "{{ ansible_host }}"
        timeout: 10
      delegate_to: localhost
      become: false

    - name: Verify node_exporter systemd unit is active
      command: systemctl is-active node_exporter
      register: node_exp_status
      changed_when: false
      failed_when: node_exp_status.stdout != "active"

    - name: Verify Alloy systemd unit is active
      command: systemctl is-active alloy
      register: alloy_status
      changed_when: false
      failed_when: alloy_status.stdout != "active"

    - name: Verify Alloy is ready
      uri:
        url: http://127.0.0.1:12345/-/ready
        status_code: 200
        timeout: 5

    - name: List listeners on the agent ports
      command: ss -H -ltn '( sport = :9100 or sport = :12345 )'
      register: agent_listeners
      changed_when: false

    - name: Verify agent ports listen only on 127.0.0.1
      assert:
        that:
          - agent_listeners.stdout_lines | length >= 2
          - agent_listeners.stdout_lines | map('split') | map(attribute=3) | select('match', '^127\.0\.0\.1:') | list | length == agent_listeners.stdout_lines | length
          - agent_listeners.stdout is search('127\.0\.0\.1:9100')
          - agent_listeners.stdout is search('127\.0\.0\.1:12345')
        fail_msg: "9100 and 12345 must each listen on 127.0.0.1 only: {{ agent_listeners.stdout }}"

    - name: Verify w1 metrics are visible on the main VPS's Prometheus
      uri:
        url: 'http://127.0.0.1:9090/api/v1/query?query=up%7Bhost%3D%22w1%22%7D%3D%3D1'
        return_content: true
      register: remote_up_query
      delegate_to: vps
      become: true
      until: >
        remote_up_query.status == 200 and
        (remote_up_query.json.data.result | length > 0)
      retries: 10
      delay: 6

    - name: Read the swap total on w1
      command: awk '/^SwapTotal:/{print $2}' /proc/meminfo
      register: w1_swap_total_kb
      changed_when: false

    - name: Verify the swap total reaches the main VPS's Prometheus
      uri:
        url: 'http://127.0.0.1:9090/api/v1/query?query=node_memory_SwapTotal_bytes%7Bhost%3D%22w1%22%7D'
        return_content: true
      register: remote_swap_query
      delegate_to: vps
      become: true
      until: >
        remote_swap_query.status == 200 and
        (remote_swap_query.json.data.result | length > 0) and
        (remote_swap_query.json.data.result[0].value[1] | float) > 0
      retries: 18
      delay: 10
      when: w1_swap_total_kb.stdout | trim | int > 0

    - name: Read whether the reboot gauge timer exists on w1
      command: systemctl cat agent-host-reboot-gauge.timer
      register: w1_gauge_unit
      changed_when: false
      failed_when: false

    - name: Verify the reboot gauge reaches the main VPS's Prometheus
      uri:
        url: 'http://127.0.0.1:9090/api/v1/query?query=agent_host_reboot_required%7Bhost%3D%22w1%22%7D'
        return_content: true
      register: remote_gauge_query
      delegate_to: vps
      become: true
      until: >
        remote_gauge_query.status == 200 and
        (remote_gauge_query.json.data.result | length > 0)
      retries: 12
      delay: 10
      when: w1_gauge_unit.rc == 0

    - name: Health check summary
      debug:
        msg: "All w1 health checks passed for {{ inventory_hostname }}"
