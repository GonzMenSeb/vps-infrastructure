---
- name: Check that an edited variables file parses back to the requested value
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "{{ plain_file }}"
  tasks:
    - name: Compare the stored value with the requested one by hash
      ansible.builtin.assert:
        that:
          - (lookup('vars', lookup('env', 'SECRET_NAME')) | string | hash('sha256')) == lookup('env', 'EXPECTED_SHA256')
        quiet: true
      no_log: true
