---
- name: Create brujula directory
  file:
    path: "{{ brujula_dir }}"
    state: directory
    mode: "0755"

- name: Create brujula session-state directory
  file:
    path: "{{ brujula_dir }}/states"
    state: directory
    mode: "0755"
    owner: "{{ brujula_container_uid }}"
    group: "{{ brujula_container_gid }}"

- name: Create brujula .env file
  template:
    src: env.j2
    dest: "{{ brujula_dir }}/.env"
    owner: root
    group: "{{ ssh_allowed_users }}"
    mode: "0640"

- name: Copy docker-compose file
  template:
    src: docker-compose.yml.j2
    dest: "{{ brujula_dir }}/docker-compose.yml"
    owner: root
    group: "{{ ssh_allowed_users }}"
    mode: "0644"

# Duplicated from the miplata role on purpose. Full playbook runs reach that role
# first, but `--tags brujula` on a fresh box would otherwise 401 on the pull below.
- name: Log in to the Zot registry as root (for Ansible-driven pulls)
  community.docker.docker_login:
    registry_url: "https://{{ zot_host }}"
    username: "{{ zot_registry_user }}"
    password: "{{ vault_zot_registry_password }}"
    reauthorize: true

# The second login is not redundant: docker credentials are per-user, and the
# `brujula-deploy` job SSHes in as {{ ssh_allowed_users }} to run `docker compose pull`.
# Without this, root can pull and the deploy job cannot. decabot is missing it.
- name: Log in to the Zot registry as {{ ssh_allowed_users }} (for Jenkins SSH deploys)
  community.docker.docker_login:
    registry_url: "https://{{ zot_host }}"
    username: "{{ zot_registry_user }}"
    password: "{{ vault_zot_registry_password }}"
    reauthorize: true
  become: true
  become_user: "{{ ssh_allowed_users }}"

- name: Ensure DNS A record for brujula
  command: >
    docker exec pdns pdnsutil replace-rrset
    {{ web_subdomain }}
    brujula
    A 3600 {{ vps_public_ip }}
  register: brujula_dns
  changed_when: "'New rrset' in brujula_dns.stdout or 'Current rrset' in brujula_dns.stdout"

# Bootstrap-tolerant pull: on a fresh VPS the image is not in Zot yet. Same pattern as
# miplata, categorizer and decabot — do not make this strict.
- name: Pull brujula image (tolerant of empty registry on first bootstrap)
  command: docker compose pull
  args:
    chdir: "{{ brujula_dir }}"
  register: brujula_pull
  failed_when: false
  changed_when: "'Pulled' in brujula_pull.stdout"

- name: Start brujula stack (only if the image was pulled successfully)
  community.docker.docker_compose_v2:
    project_src: "{{ brujula_dir }}"
    state: present
    pull: never
  when: brujula_pull.rc == 0

- name: Warn when the brujula image is not yet in the registry
  debug:
    msg: >
      Brújula image not yet available in {{ zot_host }} — skipping `up`.
      The `brujula-deploy` Jenkins job builds and pushes it on every merge to main;
      run it (or merge something) and re-run this playbook. Zot rejects Docker v2
      manifests, so a by-hand push needs buildx with oci-mediatypes=true.
  when: brujula_pull.rc != 0
