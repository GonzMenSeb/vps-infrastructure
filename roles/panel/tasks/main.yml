---
- name: Get host docker group GID
  command: getent group docker
  register: panel_docker_group
  check_mode: false
  changed_when: false

- name: Get host group GID of the .env readers
  command: getent group {{ ssh_allowed_users }}
  register: panel_env_group
  check_mode: false
  changed_when: false

- name: Set group GID facts for the panel container
  set_fact:
    panel_host_docker_gid: "{{ panel_docker_group.stdout.split(':')[2] }}"
    panel_host_env_gid: "{{ panel_env_group.stdout.split(':')[2] }}"

- name: Create panel directories
  file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "0755"
  loop:
    - { path: "{{ panel_dir }}" }
    - { path: "{{ panel_dir }}/data", owner: "{{ panel_container_uid }}", group: "{{ panel_host_env_gid }}" }

- name: Refuse to deploy panel without its OAuth and session secrets
  assert:
    that:
      - vault_panel_github_client_id | length > 0
      - vault_panel_github_client_secret | length > 0
      - vault_panel_session_secret | length >= 32
      - vault_panel_jenkins_token | length > 0
    fail_msg: "vault_panel_* must all be set (session secret 32+ chars); the panel is root-equivalent on this host"
  no_log: true

- name: Create panel .env file
  template:
    src: env.j2
    dest: "{{ panel_dir }}/.env"
    owner: root
    group: "{{ ssh_allowed_users }}"
    mode: "0640"

- name: Render panel services manifest
  template:
    src: services.json.j2
    dest: "{{ panel_dir }}/services.json"
    owner: root
    group: "{{ ssh_allowed_users }}"
    mode: "0644"

- name: Copy docker-compose file
  template:
    src: docker-compose.yml.j2
    dest: "{{ panel_dir }}/docker-compose.yml"
    owner: root
    group: "{{ ssh_allowed_users }}"
    mode: "0644"

- name: Log in to the Zot registry as root (for Ansible-driven pulls)
  community.docker.docker_login:
    registry_url: "https://{{ zot_host }}"
    username: "{{ zot_registry_user }}"
    password: "{{ vault_zot_registry_password }}"
    reauthorize: true

- name: Log in to the Zot registry as {{ ssh_allowed_users }} (for Jenkins SSH deploys)
  community.docker.docker_login:
    registry_url: "https://{{ zot_host }}"
    username: "{{ zot_registry_user }}"
    password: "{{ vault_zot_registry_password }}"
    reauthorize: true
  become: true
  become_user: "{{ ssh_allowed_users }}"

- name: Ensure DNS A record for panel
  command: >
    docker exec pdns pdnsutil replace-rrset
    {{ web_subdomain }}
    panel
    A 3600 {{ vps_public_ip }}
  register: panel_dns
  changed_when: "'New rrset' in panel_dns.stdout or 'Current rrset' in panel_dns.stdout"

- name: Pull panel image (tolerant of empty registry on first bootstrap)
  command: docker compose pull
  args:
    chdir: "{{ panel_dir }}"
  register: panel_pull
  failed_when: false
  changed_when: "'Pulled' in panel_pull.stdout"

- name: Start panel stack (only if the image was pulled successfully)
  community.docker.docker_compose_v2:
    project_src: "{{ panel_dir }}"
    state: present
    pull: never
  when: panel_pull.rc == 0

- name: Warn when the panel image is not yet in the registry
  debug:
    msg: >
      panel image not yet available in {{ zot_host }} - skipping `up`.
      The `panel-deploy` Jenkins job builds and pushes it on every push to main.
  when: panel_pull.rc != 0
