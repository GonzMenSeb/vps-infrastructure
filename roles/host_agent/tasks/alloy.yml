---
- name: Create alloy user
  user:
    name: alloy
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    groups: systemd-journal
    append: true

- name: Create Alloy version directory
  file:
    path: "{{ host_agent_alloy_dir }}/{{ host_agent_alloy_version }}"
    state: directory
    mode: "0755"

- name: Download Alloy
  get_url:
    url: "https://github.com/grafana/alloy/releases/download/v{{ host_agent_alloy_version }}/alloy-linux-amd64.zip"
    dest: "{{ host_agent_alloy_dir }}/{{ host_agent_alloy_version }}/alloy-linux-amd64.zip"
    checksum: "sha256:https://github.com/grafana/alloy/releases/download/v{{ host_agent_alloy_version }}/SHA256SUMS"
    mode: "0644"

- name: Extract Alloy
  unarchive:
    src: "{{ host_agent_alloy_dir }}/{{ host_agent_alloy_version }}/alloy-linux-amd64.zip"
    dest: "{{ host_agent_alloy_dir }}/{{ host_agent_alloy_version }}"
    remote_src: true
    mode: "0755"
    creates: "{{ host_agent_alloy_dir }}/{{ host_agent_alloy_version }}/alloy-linux-amd64"

- name: Link Alloy to the pinned version
  file:
    src: "{{ host_agent_alloy_dir }}/{{ host_agent_alloy_version }}/alloy-linux-amd64"
    dest: /usr/local/bin/alloy
    state: link
    force: true
  notify: restart alloy

- name: Create Alloy state directory
  file:
    path: "{{ host_agent_alloy_state_dir }}"
    state: directory
    owner: alloy
    group: alloy
    mode: "0750"

- name: Create Alloy config directory
  file:
    path: "{{ host_agent_alloy_config_dir }}"
    state: directory
    owner: root
    group: alloy
    mode: "0750"

- name: Deploy Alloy config
  template:
    src: alloy-config.alloy.j2
    dest: "{{ host_agent_alloy_config_dir }}/config.alloy"
    owner: root
    group: alloy
    mode: "0640"
  diff: false
  notify: restart alloy

- name: Install Alloy systemd service
  template:
    src: alloy.service.j2
    dest: /etc/systemd/system/alloy.service
    mode: "0644"
  notify: restart alloy

- name: Enable Alloy
  systemd:
    name: alloy
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending restarts
  meta: flush_handlers

- name: Wait for Alloy readiness
  uri:
    url: "http://{{ host_agent_alloy_listen }}/-/ready"
    status_code: 200
  register: alloy_ready
  retries: 10
  delay: 3
  until: alloy_ready.status == 200
