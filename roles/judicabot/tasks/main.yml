---
- name: Create judicabot directories
  file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "0755"
  loop:
    - { path: "{{ judicabot_dir }}" }
    - { path: "{{ judicabot_dir }}/casos", owner: "{{ judicabot_container_uid }}", group: "{{ judicabot_container_gid }}" }
    - { path: "{{ judicabot_dir }}/cache", owner: "{{ judicabot_container_uid }}", group: "{{ judicabot_container_gid }}" }

- name: Create judicabot .env file
  template:
    src: env.j2
    dest: "{{ judicabot_dir }}/.env"
    owner: root
    group: "{{ ssh_allowed_users }}"
    mode: "0640"

- name: Copy docker-compose file
  template:
    src: docker-compose.yml.j2
    dest: "{{ judicabot_dir }}/docker-compose.yml"
    owner: root
    group: "{{ ssh_allowed_users }}"
    mode: "0644"

- name: Log in to the Zot registry as root (for Ansible-driven pulls)
  community.docker.docker_login:
    registry_url: "https://{{ zot_host }}"
    username: "{{ zot_registry_user }}"
    password: "{{ vault_zot_registry_password }}"
    reauthorize: true

- name: Ensure DNS A record for judicabot
  command: >
    docker exec pdns pdnsutil replace-rrset
    {{ web_subdomain }}
    judicabot
    A 3600 {{ vps_public_ip }}
  register: judicabot_dns
  changed_when: "'New rrset' in judicabot_dns.stdout or 'Current rrset' in judicabot_dns.stdout"

- name: Pull judicabot image (tolerant of empty registry on first bootstrap)
  command: docker compose pull
  args:
    chdir: "{{ judicabot_dir }}"
  register: judicabot_pull
  failed_when: false
  changed_when: "'Pulled' in judicabot_pull.stdout"

- name: Start judicabot stack (only if the image was pulled successfully)
  community.docker.docker_compose_v2:
    project_src: "{{ judicabot_dir }}"
    state: present
    pull: never
  when: judicabot_pull.rc == 0

- name: Warn when the judicabot image is not yet in the registry
  debug:
    msg: >
      judicabot image not yet available in {{ zot_host }} - skipping `up`.
      The `judicabot-deploy` Jenkins job builds and pushes it on every push to main.
  when: judicabot_pull.rc != 0
