---
# Traefik owns 80/443. Nothing in this repo installs Caddy, but the deb leaves an
# ENABLED systemd unit behind: on the 2026-07-09 reboot caddy.service won the race for
# both ports, traefik exited 128, and the entire public plane — grafana, miplata,
# metabase, zot, categorizer — stayed down for 19 days without alerting anybody.
# Masked, not merely disabled: disabling still permits socket/dependency activation.
# Nothing is uninstalled and /etc/caddy is untouched, so this is reversible.
- name: Collect service facts
  ansible.builtin.service_facts:

- name: Stop and disable host web servers contending for 80/443
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ traefik_contending_services }}"
  when: (item ~ '.service') in ansible_facts.services

# Separate task: masking a unit that is still running does not stop it, so the stop
# above has to have already happened.
- name: Mask host web servers contending for 80/443
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
  loop: "{{ traefik_contending_services }}"
  when: (item ~ '.service') in ansible_facts.services

- name: Create Traefik directory
  file:
    path: "{{ traefik_dir }}"
    state: directory
    mode: "0755"

- name: Copy Traefik static config
  template:
    src: traefik.yml.j2
    dest: "{{ traefik_dir }}/traefik.yml"
    mode: "0644"
  notify: restart traefik

- name: Copy nginx socket proxy config
  copy:
    src: "{{ item }}"
    dest: "{{ traefik_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - nginx.conf
    - nginx-docker-proxy.conf
  notify: restart traefik

- name: Copy docker-compose file
  template:
    src: docker-compose.yml.j2
    dest: "{{ traefik_dir }}/docker-compose.yml"
    mode: "0644"

- name: Ensure acme.json exists with correct permissions
  file:
    path: "{{ traefik_dir }}/acme.json"
    state: touch
    mode: "0600"
    modification_time: preserve
    access_time: preserve

- name: Start Traefik stack
  community.docker.docker_compose_v2:
    project_src: "{{ traefik_dir }}"
    state: present
    pull: missing
