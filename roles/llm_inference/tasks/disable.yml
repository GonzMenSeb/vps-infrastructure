---
- name: Check whether an llm_inference stack was ever deployed on this host
  stat:
    path: "{{ llm_inference_dir }}/docker-compose.yml"
  register: llm_inference_compose_present

- name: Stop and remove the llama-server container (the models directory is kept)
  community.docker.docker_compose_v2:
    project_src: "{{ llm_inference_dir }}"
    state: absent
  when: llm_inference_compose_present.stat.exists
