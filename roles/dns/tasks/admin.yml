---
- name: Wait for PowerDNS Admin to accept requests
  command: docker exec pdns-admin wget -q -O /dev/null http://127.0.0.1/login
  register: pdns_admin_ready
  changed_when: false
  retries: 12
  delay: 5
  until: pdns_admin_ready.rc == 0

- name: Seed the PowerDNS Admin administrator
  command: >
    docker exec -i pdns-admin python3 -
    {{ pdns_admin_github_login }} {{ pdns_admin_github_login }}@users.noreply.github.com
  args:
    stdin: "{{ lookup('file', role_path ~ '/files/seed-admin.py') }}"
  register: pdns_admin_seed
  changed_when: "'seeded' in pdns_admin_seed.stdout"
  failed_when: "pdns_admin_seed.rc != 0 or 'failed' in pdns_admin_seed.stdout"
