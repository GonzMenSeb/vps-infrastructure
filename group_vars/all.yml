---
domain: "{{ vault_domain }}"
web_subdomain: "web.{{ vault_domain }}"
acme_email: "{{ vault_acme_email }}"

# Docker networks (created once, shared across stacks)
docker_networks:
  - proxy
  - miplata_db
  - categorizer_net

# SSH
ssh_allowed_users: ubuntu
ssh_user_home: "{{ '/root' if ssh_allowed_users == 'root' else '/home/' ~ ssh_allowed_users }}"
ssh_authorized_keys: "{{ vault_ssh_authorized_keys }}"
ssh_max_auth_tries: 3

# fail2ban
fail2ban_ssh_maxretry: 3
fail2ban_ssh_bantime: 3h
fail2ban_default_bantime: 1h
fail2ban_default_findtime: 10m

# UFW allowed ports
ufw_allowed_ports:
  - { port: 22, proto: tcp, comment: "SSH" }
  - { port: 53, proto: tcp, comment: "DNS-TCP" }
  - { port: 53, proto: udp, comment: "DNS-UDP" }
  - { port: 80, proto: tcp, comment: "HTTP" }
  - { port: 443, proto: tcp, comment: "HTTPS" }

# Traefik
traefik_version: "v3.6.13"
traefik_dashboard_host: "traefik.{{ web_subdomain }}"
traefik_dashboard_auth: "admin:$$2y$$05$$pvEIRx9O8AZhW2Cr6OFufeuwF09Y0xe3VArKdxPeWESSmGnPYCrAq"

# DNS
pdns_image: "powerdns/pdns-auth-49:4.9.13"
pdns_admin_image: "powerdnsadmin/pda-legacy:0.4.2"
pdns_mariadb_image: "mariadb:10.11"
pdns_admin_host: "dns.{{ web_subdomain }}"
pdns_soa: "ns1.{{ domain }}. hostmaster.{{ domain }}. 0 10800 3600 604800 3600"

# Vaultwarden
vaultwarden_image: "vaultwarden/server:1.35.7"
vaultwarden_host: "vault.{{ web_subdomain }}"

# Monitoring
prometheus_image: "prom/prometheus:v3.11.2"
grafana_image: "grafana/grafana:12.4.3"
loki_image: "grafana/loki:3.7.1"
alloy_image: "grafana/alloy:v1.15.1"
cadvisor_image: "ghcr.io/google/cadvisor:0.56.2"
postgres_exporter_image: "prometheuscommunity/postgres-exporter:v0.19.1"
redis_exporter_image: "oliver006/redis_exporter:v1.82.0"
blackbox_exporter_image: "prom/blackbox-exporter:v0.28.0"
alertmanager_image: "prom/alertmanager:v0.32.0"
prometheus_retention: "30d"
prometheus_retention_size: "8GB"
loki_retention: "336h"  # 14 days

# Tempo + tracing (feature-flagged)
enable_tracing: true
tempo_image: "grafana/tempo:2.10.4"
tempo_retention: "168h"       # 7 days
tempo_max_block_bytes: 500000000

# Extra observability exporters
process_exporter_image: "ncabatoff/process-exporter:0.8.7"

grafana_host: "grafana.{{ web_subdomain }}"
loki_push_host: "loki-push.{{ web_subdomain }}"
prom_push_host: "prom-push.{{ web_subdomain }}"
prometheus_ui_host: "prometheus.{{ web_subdomain }}"
grafana_github_admin_login: "GonzMenSeb"
observability_network: "observability"
observability_agent_dir: /opt/observability
loki_push_url: "https://{{ loki_push_host }}/loki/api/v1/push"
prom_push_url: "https://{{ prom_push_host }}/api/v1/write"

# Jenkins
jenkins_host: "jenkins.{{ web_subdomain }}"
jenkins_image: "jenkins/jenkins:lts-jdk21"
github_repo_ssh_url: "git@github.com:GonzMenSeb/vps-infrastructure.git"

# Zot registry (self-hosted OCI registry)
zot_host: "zot.{{ web_subdomain }}"
zot_registry_user: "ci"
zot_gc_delay: "1h"
zot_gc_interval: "24h"

# Miplata
miplata_host: "miplata.{{ web_subdomain }}"
miplata_ro_user: metabase_ro
miplata_api_image: "{{ zot_host }}/miplata/api:latest"
miplata_web_image: "{{ zot_host }}/miplata/web:latest"
miplata_repo_ssh_url: "git@github.com:GonzMenSeb/miplata.git"

# Metabase
metabase_image: "metabase/metabase:v0.60.1"
metabase_postgres_image: "postgres:16-alpine"
metabase_host: "metabase.{{ web_subdomain }}"

# LLM inference (self-hosted Qwen3-4B via llama.cpp's llama-server).
# TODO: verify this tag resolves against ghcr.io/ggml-org/llama.cpp before first deploy.
llm_inference_image: "ghcr.io/ggml-org/llama.cpp:server"

# DecaBot — Los Prompteros expedition concierge (Reflex + Gemini + Decathlon UCP).
# Built by the `decabot-deploy` Jenkins job; docs/DEPLOY.md in the app repo covers the
# by-hand path, and note that Zot needs OCI media types or the manifest PUT fails with
# 415 after every layer uploads.
decabot_host: "decabot.{{ web_subdomain }}"
decabot_image: "{{ zot_host }}/losprompteros/decabot:latest"
decabot_repo_ssh_url: "git@github.com:GonzMenSeb/Los-Prompteros-Project.git"

# Brújula and Huella — the two COROS apps (Reflex + Gemini + COROS UCP; Huella adds Strava
# OAuth). ONE repo, two images: the monorepo's infra/jenkins/Jenkinsfile gates on touched
# paths and builds each app separately, so the SSH URL is a single shared variable and the
# `brujula-deploy` / `huella-deploy` jobs both point at it.
coros_repo_ssh_url: "git@github.com:GonzMenSeb/corosBot.git"

judicabot_host: "judicabot.{{ web_subdomain }}"
judicabot_image: "{{ zot_host }}/judicabot/judicabot:latest"
judicabot_repo_url: "https://github.com/GonzMenSeb/judicabot.git"

brujula_host: "brujula.{{ web_subdomain }}"
brujula_image: "{{ zot_host }}/coros/brujula:latest"

huella_host: "huella.{{ web_subdomain }}"
huella_image: "{{ zot_host }}/coros/huella:latest"

# Transaction categorizer (Colombian-Spanish cascade).
# Self-hosted, no Claude fallback in production (per user policy).
# Image is built by Jenkins job `categorizer-deploy` and pushed to Zot.
categorizer_host: "categorizer.{{ web_subdomain }}"
categorizer_image: "{{ zot_host }}/miplata/categorizer:latest"
categorizer_postgres_image: "pgvector/pgvector:pg16"
categorizer_repo_ssh_url: "git@github.com:GonzMenSeb/miplata-categorizer.git"

panel_host: "panel.{{ web_subdomain }}"
panel_image: "{{ zot_host }}/panel/panel:latest"
# numeric GitHub account id of grafana_github_admin_login
panel_github_allowed_id: 88598670

panel_services:
  - id: traefik
    name: Traefik
    role: traefik
    tags: [traefik]
    playbook: playbook.yml
    host: vps
    dir: /opt/traefik
    containers: [traefik, docker-proxy]
    images: ["traefik:{{ traefik_version }}", "nginx:alpine"]
    hostname: "{{ traefik_dashboard_host }}"
    jenkins_job: vps-deploy
    db: []
    core: true
    auth: "{{ panel_service_auth['traefik'] }}"
  - id: dns
    name: PowerDNS
    role: dns
    tags: [dns]
    playbook: playbook.yml
    host: vps
    dir: /opt/dns
    containers: [pdns, pdns-db, pdns-admin]
    images: ["{{ pdns_image }}", "{{ pdns_mariadb_image }}", "{{ pdns_admin_image }}"]
    hostname: "{{ pdns_admin_host }}"
    jenkins_job: vps-deploy
    db:
      - { kind: mariadb, container: pdns-db }
    core: true
    auth: "{{ panel_service_auth['dns'] }}"
  - id: vaultwarden
    name: Vaultwarden
    role: vaultwarden
    tags: [vaultwarden]
    playbook: playbook.yml
    host: vps
    dir: /opt/vaultwarden
    containers: [vaultwarden]
    images: ["{{ vaultwarden_image }}"]
    hostname: "{{ vaultwarden_host }}"
    jenkins_job: vps-deploy
    db: []
    core: false
    auth: "{{ panel_service_auth['vaultwarden'] }}"
  - id: monitoring
    name: Monitoring
    role: monitoring
    tags: [monitoring]
    playbook: playbook.yml
    host: vps
    dir: /opt/monitoring
    containers: [prometheus, loki, grafana, alloy, process-exporter, cadvisor, blackbox-exporter, tempo, alertmanager]
    images: ["{{ prometheus_image }}", "{{ loki_image }}", "{{ grafana_image }}", "{{ alloy_image }}", "{{ process_exporter_image }}", "{{ cadvisor_image }}", "{{ blackbox_exporter_image }}", "{{ tempo_image }}", "{{ alertmanager_image }}"]
    hostname: "{{ grafana_host }}"
    jenkins_job: vps-deploy
    db: []
    core: false
    auth: "{{ panel_service_auth['monitoring'] }}"
  - id: zot
    name: Zot registry
    role: zot
    tags: [zot]
    playbook: playbook.yml
    host: vps
    dir: /opt/zot
    containers: [zot]
    images: ["{{ zot_image }}"]
    hostname: "{{ zot_host }}"
    jenkins_job: vps-deploy
    db: []
    core: true
    auth: "{{ panel_service_auth['zot'] }}"
  - id: miplata
    name: Miplata
    role: miplata
    tags: [miplata]
    playbook: playbook.yml
    host: vps
    dir: /opt/miplata
    containers: [miplata-api, miplata-web, miplata-postgres, miplata-redis, postgres-exporter, redis-exporter]
    images: ["{{ miplata_api_image }}", "{{ miplata_web_image }}"]
    hostname: "{{ miplata_host }}"
    jenkins_job: miplata-deploy
    db:
      - { kind: postgres, container: miplata-postgres }
      - { kind: redis, container: miplata-redis }
    core: false
    auth: "{{ panel_service_auth['miplata'] }}"
  - id: metabase
    name: Metabase
    role: metabase
    tags: [metabase]
    playbook: playbook.yml
    host: vps
    dir: /opt/metabase
    containers: [metabase, metabase-db]
    images: ["{{ metabase_image }}", "{{ metabase_postgres_image }}"]
    hostname: "{{ metabase_host }}"
    jenkins_job: vps-deploy
    db:
      - { kind: postgres, container: metabase-db }
    core: false
    auth: "{{ panel_service_auth['metabase'] }}"
  - id: llm_inference
    name: LLM inference
    role: llm_inference
    tags: [llm_inference]
    playbook: playbook.yml
    host: vps
    dir: /opt/llm_inference
    containers: [llama-server]
    images: ["{{ llm_inference_image }}"]
    hostname: null
    jenkins_job: vps-deploy
    db: []
    core: false
    auth: "{{ panel_service_auth['llm_inference'] }}"
  - id: categorizer
    name: Categorizer
    role: categorizer
    tags: [categorizer]
    playbook: playbook.yml
    host: vps
    dir: /opt/categorizer
    containers: [categorizer-api, categorizer-postgres]
    images: ["{{ categorizer_image }}", "{{ categorizer_postgres_image }}"]
    hostname: "{{ categorizer_host }}"
    jenkins_job: categorizer-deploy
    db:
      - { kind: postgres, container: categorizer-postgres }
    core: false
    auth: "{{ panel_service_auth['categorizer'] }}"
  - id: decabot
    name: DecaBot
    role: decabot
    tags: [decabot]
    playbook: playbook.yml
    host: vps
    dir: /opt/decabot
    containers: [decabot]
    images: ["{{ decabot_image }}"]
    hostname: "{{ decabot_host }}"
    jenkins_job: decabot-deploy
    db: []
    core: false
    auth: "{{ panel_service_auth['decabot'] }}"
  - id: brujula
    name: Brujula
    role: brujula
    tags: [brujula]
    playbook: playbook.yml
    host: vps
    dir: /opt/brujula
    containers: [brujula]
    images: ["{{ brujula_image }}"]
    hostname: "{{ brujula_host }}"
    jenkins_job: brujula-deploy
    db: []
    core: false
    auth: "{{ panel_service_auth['brujula'] }}"
  - id: huella
    name: Huella
    role: huella
    tags: [huella]
    playbook: playbook.yml
    host: vps
    dir: /opt/huella
    containers: [huella]
    images: ["{{ huella_image }}"]
    hostname: "{{ huella_host }}"
    jenkins_job: huella-deploy
    db: []
    core: false
    auth: "{{ panel_service_auth['huella'] }}"
  - id: judicabot
    name: Judicabot
    role: judicabot
    tags: [judicabot]
    playbook: playbook.yml
    host: vps
    dir: /opt/judicabot
    containers: [judicabot]
    images: ["{{ judicabot_image }}"]
    hostname: "{{ judicabot_host }}"
    jenkins_job: judicabot-deploy
    db: []
    core: false
    auth: "{{ panel_service_auth['judicabot'] }}"
  - id: panel
    name: Panel
    role: panel
    tags: [panel]
    playbook: playbook.yml
    host: vps
    dir: /opt/panel
    containers: [panel]
    images: ["{{ panel_image }}"]
    hostname: "{{ panel_host }}"
    jenkins_job: panel-deploy
    db: []
    core: true
    auth: "{{ panel_service_auth['panel'] }}"
  - id: jenkins
    name: Jenkins
    role: jenkins
    tags: []
    playbook: jenkins-playbook.yml
    host: jenkins
    dir: /opt/jenkins
    containers: [jenkins]
    images: ["jenkins-ansible:latest"]
    hostname: "{{ jenkins_host }}"
    jenkins_job: null
    db: []
    core: true
    auth:
      kind: vault
      vault_vars: [vault_jenkins_admin_password]
      env_keys: []

# The auth block of every main-VPS service in panel_services, kept apart because the Jenkins
# play renders panel_secret_vars, and templating panel_services itself needs image variables that
# only the roles of playbook.yml define. Plain data only: nothing here may contain Jinja.
panel_service_auth:
  traefik:
    kind: basic-auth-hash
    vault_vars: []
    env_keys: []
    hash:
      var: traefik_dashboard_auth
      user: admin
      note: "The same login protects the Prometheus UI. vps-deploy does not update the Jenkins host's dashboard; run jenkins-playbook.yml for that."
  dns:
    kind: env
    vault_vars: [vault_pdns_db_root_password, vault_pdns_db_password, vault_pdns_admin_secret_key, vault_pdns_api_key]
    env_keys: [DB_ROOT_PASSWORD, DB_PASSWORD, ADMIN_SECRET_KEY, PDNS_API_KEY]
    env_vars:
      DB_ROOT_PASSWORD: vault_pdns_db_root_password
      DB_PASSWORD: vault_pdns_db_password
      ADMIN_SECRET_KEY: vault_pdns_admin_secret_key
      PDNS_API_KEY: vault_pdns_api_key
  vaultwarden:
    kind: env
    vault_vars: [vault_vaultwarden_admin_token]
    env_keys: [ADMIN_TOKEN]
    env_vars:
      ADMIN_TOKEN: vault_vaultwarden_admin_token
  monitoring:
    kind: vault
    vault_vars: [vault_grafana_admin_password, vault_grafana_oauth_client_id, vault_grafana_oauth_client_secret, vault_grafana_secret_key, vault_observability_push_token]
    env_keys: []
  zot:
    kind: vault
    vault_vars: [vault_zot_registry_password, vault_zot_htpasswd_hash]
    env_keys: []
  miplata:
    kind: env
    vault_vars: [vault_miplata_db_password, vault_miplata_jwt_secret, vault_miplata_encryption_key, vault_miplata_admin_password, vault_categorizer_api_token]
    env_keys: [POSTGRES_PASSWORD, JWT_SECRET, ENCRYPTION_KEY, ADMIN_PASSWORD, CATEGORIZER_API_TOKEN]
    env_vars:
      POSTGRES_PASSWORD: vault_miplata_db_password
      JWT_SECRET: vault_miplata_jwt_secret
      ENCRYPTION_KEY: vault_miplata_encryption_key
      ADMIN_PASSWORD: vault_miplata_admin_password
      CATEGORIZER_API_TOKEN: vault_categorizer_api_token
  metabase:
    kind: env
    vault_vars: [vault_metabase_db_password, vault_miplata_ro_password, vault_metabase_admin_password]
    env_keys: [MB_DB_PASS, POSTGRES_PASSWORD]
    env_vars:
      MB_DB_PASS: vault_metabase_db_password
      POSTGRES_PASSWORD: vault_metabase_db_password
  llm_inference:
    kind: none
    vault_vars: []
    env_keys: []
  categorizer:
    kind: env
    vault_vars: [vault_categorizer_db_password, vault_categorizer_api_token]
    env_keys: [POSTGRES_PASSWORD, CATEGORIZER_API_TOKEN]
    env_vars:
      POSTGRES_PASSWORD: vault_categorizer_db_password
      CATEGORIZER_API_TOKEN: vault_categorizer_api_token
  decabot:
    kind: env
    vault_vars: [vault_decabot_password, vault_decabot_gemini_api_key]
    env_keys: [DECABOT_PASSWORD, GEMINI_API_KEY]
    env_vars:
      DECABOT_PASSWORD: vault_decabot_password
      GEMINI_API_KEY: vault_decabot_gemini_api_key
  brujula:
    kind: env
    vault_vars: [vault_brujula_password, vault_decabot_gemini_api_key]
    env_keys: [BRUJULA_PASSWORD, GEMINI_API_KEY]
    env_vars:
      BRUJULA_PASSWORD: vault_brujula_password
      GEMINI_API_KEY: vault_decabot_gemini_api_key
  huella:
    kind: env
    vault_vars: [vault_huella_password, vault_decabot_gemini_api_key, vault_strava_client_id, vault_strava_client_secret]
    env_keys: [HUELLA_PASSWORD, GEMINI_API_KEY, STRAVA_CLIENT_ID, STRAVA_CLIENT_SECRET]
    env_vars:
      HUELLA_PASSWORD: vault_huella_password
      GEMINI_API_KEY: vault_decabot_gemini_api_key
      STRAVA_CLIENT_ID: vault_strava_client_id
      STRAVA_CLIENT_SECRET: vault_strava_client_secret
  judicabot:
    kind: env
    vault_vars: [vault_judicabot_password]
    env_keys: [JUDICABOT_PASSWORD]
    env_vars:
      JUDICABOT_PASSWORD: vault_judicabot_password
  panel:
    kind: vault
    vault_vars: [vault_panel_github_client_id, vault_panel_github_client_secret, vault_panel_session_secret, vault_panel_jenkins_token]
    env_keys: []

# Every vault variable in panel_service_auth must be in exactly one of panel_secret_editable and
# panel_secret_locked, so a variable someone adds there is read-only until it is classified here.
# roles/panel asserts this. panel_secret_vars (editable minus locked) is what the panel-secrets job
# and the panel's manifest receive as the allowlist; only main-VPS services are listed because
# vps-deploy runs playbook.yml and never jenkins-playbook.yml.
panel_secret_editable:
  - vault_brujula_password
  - vault_decabot_gemini_api_key
  - vault_decabot_password
  - vault_grafana_oauth_client_id
  - vault_grafana_oauth_client_secret
  - vault_huella_password
  - vault_judicabot_password
  - vault_miplata_admin_password
  - vault_miplata_jwt_secret
  - vault_pdns_admin_secret_key
  - vault_pdns_api_key
  - vault_strava_client_id
  - vault_strava_client_secret
  - vault_vaultwarden_admin_token

panel_secret_locked:
  vault_zot_registry_password: "It must change together with vault_zot_htpasswd_hash, the Jenkins registry credential and every docker login, and vps-deploy does not update the Jenkins host."
  vault_zot_htpasswd_hash: "It must change together with vault_zot_registry_password."
  vault_categorizer_api_token: "The Jenkins host keeps a copy as the categorizer-api-token credential, and vps-deploy does not update that host."
  vault_observability_push_token: "The agent on the Jenkins host sends with it and vps-deploy does not update that host, so metrics and logs would stop arriving."
  vault_pdns_db_root_password: "MariaDB reads it only when it first creates its database, and nothing in the playbook changes it inside the running database."
  vault_pdns_db_password: "MariaDB reads it only when it first creates its database, and nothing in the playbook changes it inside the running database."
  vault_miplata_db_password: "Postgres reads it only when it first creates its database, and no role runs ALTER USER for it, so the service would lose access to its database."
  vault_metabase_db_password: "Postgres reads it only when it first creates its database, and no role runs ALTER USER for it, so the service would lose access to its database."
  vault_categorizer_db_password: "Postgres reads it only when it first creates its database, and no role runs ALTER USER for it, so the service would lose access to its database."
  vault_miplata_ro_password: "The playbook changes the Postgres role, but Metabase keeps its own copy of the password, written only during its first setup."
  vault_metabase_admin_password: "The metabase role uses it only to create the admin during first setup."
  vault_miplata_encryption_key: "It is an encryption key: data already encrypted with the old key cannot be read after the change."
  vault_grafana_secret_key: "Grafana encrypts the secrets it stores with it and cannot read them back after the change."
  vault_grafana_admin_password: "Grafana reads admin_password only when it first creates its database."
  vault_panel_github_client_id: "It is the panel's own sign-in, and a wrong value locks the panel out."
  vault_panel_github_client_secret: "It is the panel's own sign-in, and a wrong value locks the panel out."
  vault_panel_session_secret: "It is the panel's own sign-in, and changing it signs everyone out mid-flow."
  vault_panel_jenkins_token: "The panel uses it to reach Jenkins, including this edit."

# Variables the panel may rotate to a random value; nothing outside the host holds a copy.
panel_secret_rotatable:
  - vault_vaultwarden_admin_token
  - vault_decabot_password
  - vault_brujula_password
  - vault_huella_password
  - vault_judicabot_password

# Minimum lengths for editable variables, enforced by the panel and by panel-secrets.sh (rendered
# as PANEL_SECRET_MIN). Externally issued ids and keys (Strava, the GitHub OAuth app, Gemini) have
# no floor of their own. roles/judicabot asserts the same 12 for its password.
panel_secret_min_length:
  vault_decabot_password: 12
  vault_brujula_password: 12
  vault_huella_password: 12
  vault_judicabot_password: 12
  vault_miplata_admin_password: 12
  vault_miplata_jwt_secret: 12
  vault_pdns_admin_secret_key: 12
  vault_pdns_api_key: 12
  vault_vaultwarden_admin_token: 12

panel_secret_vars: >-
  {{ panel_secret_editable
     | difference(panel_secret_locked.keys() | list)
     | sort
     | list }}
panel_hash_vars: >-
  {{ panel_service_auth.values()
     | selectattr('hash', 'defined')
     | map(attribute='hash.var')
     | list }}
