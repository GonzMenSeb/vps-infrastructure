---
- name: Configure VPS
  hosts: vps
  become: true
  vars_files:
    - vault.yml

  # Order is the contract — there are no role dependencies, so traefik must stay ahead
  # of everything that joins the `proxy` network. Tags let you re-run one service
  # without replaying the whole box; they do NOT make the order safe to ignore.
  roles:
    - { role: base, tags: [base] }
    - { role: docker, tags: [docker] }
    - { role: traefik, tags: [traefik] }
    - { role: dns, tags: [dns] }
    - { role: vaultwarden, tags: [vaultwarden] }
    - { role: monitoring, tags: [monitoring] }
    - { role: zot, tags: [zot] }
    - { role: miplata, tags: [miplata] }
    - { role: metabase, tags: [metabase] }
    - { role: llm_inference, tags: [llm_inference] }
    - { role: categorizer, tags: [categorizer] }
    - { role: decabot, tags: [decabot] }

  post_tasks:
    # Textfile-collector deploy marker — annotates timeseries panels with a
    # vertical line whenever Ansible successfully completes a run.
    - name: Write Ansible deploy marker (textfile collector)
      ansible.builtin.copy:
        dest: /var/lib/node_exporter/textfile/ansible_deploy.prom
        owner: node_exporter
        group: node_exporter
        mode: "0644"
        content: |
          # HELP vps_last_deploy_timestamp_seconds Unix timestamp of the last successful Ansible deploy.
          # TYPE vps_last_deploy_timestamp_seconds gauge
          vps_last_deploy_timestamp_seconds{playbook="playbook.yml",host="{{ inventory_hostname }}"} {{ ansible_date_time.epoch }}
